<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#131313">
  <meta name="description" content="EMC Soldas - Sistema Integrado de Gestão de Orçamentos, Faturamento e Tesouraria Industrial">
  
  <title>EMC Soldas | Gestão Integrada</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Tipografia Técnica do Design System (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos do Design System Industrial Integrity -->
  <link rel="stylesheet" href="/assets/css/industrial-integrity.css?v=4.16">
  <link rel="stylesheet" href="/assets/css/layout.css?v=4.16">
</head>
<body>
  <div class="app-wrapper">
    <!-- Sidebar Retrátil -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div style="width: 12px; height: 12px; background-color: var(--color-rust-orange);"></div>
        <span class="sidebar-logo-text">EMC SOLDAS</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-item active" data-route="dashboard">
          Dashboard
        </a>
        <a href="#/orcamentos" class="nav-item" data-route="orcamentos" data-permission="acesso_comercial">
          Orçamentos
        </a>
        <a href="#/faturamento" class="nav-item" data-route="faturamento" data-permission="acesso_comercial">
          Faturamento & Conta Corrente
        </a>
        <a href="#/tesouraria" class="nav-item" data-route="tesouraria" data-permission="acesso_tesouraria">
          Tesouraria & Caixa
        </a>
        <a href="#/conciliacao" class="nav-item" data-route="conciliacao" data-permission="acesso_tesouraria">
          Conciliação Bancária
        </a>
        <a href="#/compras" class="nav-item" data-route="compras" data-permission="acesso_compras">
          Compras & Entradas
        </a>
        <a href="#/catalogo" class="nav-item" data-route="catalogo" data-permission="gestao_catalogo">
          Catálogo & Motor BOM
        </a>
        <a href="#/clientes" class="nav-item" data-route="clientes">
          Clientes & Equipamentos
        </a>
        <a href="#/relatorios" class="nav-item" data-route="relatorios" data-permission="visao_relatorios">
          Central Analítica
        </a>
        <a href="#/administracao" class="nav-item" data-route="administracao" data-permission="configuracoes_globais">
          Administração
        </a>
      </nav>
    </aside>

    <!-- Overlay para fechar sidebar no mobile/tablet -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Área de Conteúdo Principal -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title-wrapper">
          <button class="btn btn-ghost btn-sm" id="btn-toggle-sidebar" style="display: none; padding: 4px 8px; font-size: 14px;" title="Abrir Menu">☰</button>
          <h2 class="topbar-title" id="page-title">Painel de Operações</h2>
        </div>

        <div class="topbar-actions" id="topbar-actions-container">
          <span class="status-chip success" id="network-status-chip">ONLINE</span>
          <span class="status-chip secondary mono-text" id="session-timer-chip" style="display: none;" title="Tempo de inatividade restante até o bloqueio (Soft Lock)">⏱ --:--</span>
          <span class="status-chip info" id="user-role-badge">OPERADOR</span>
          <span class="mono-text" id="user-email-display">-</span>
          
          <button class="btn btn-secondary btn-sm" id="btn-manual-soft-lock" title="Bloquear Tela (Soft Lock)">🔒 TRAVAR</button>
          <button class="btn btn-ghost btn-sm" id="btn-topbar-logout" title="Encerrar Sessão">SAIR</button>
        </div>
      </header>

      <section class="content-body" id="app-root">
        <div class="text-center" style="padding: 60px 0;">
          <div class="loader-spinner"></div>
          <p class="mono-text mt-16" style="color: var(--color-on-surface-variant);">INICIALIZANDO SISTEMA INDUSTRIAL...</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Container Global de Modais -->
  <div id="modal-root"></div>

  <!-- Container de Notificações Toast -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts da Aplicação Client-Side -->
  <script src="/assets/js/config.js?v=4.16"></script>
  <script src="/assets/js/utils.js?v=4.16"></script>
  <script src="/assets/js/api.js?v=4.16"></script>
  <script src="/assets/js/auth.js?v=4.16"></script>

  <!-- Módulos de Telas (Views) -->
  <script src="/assets/js/views/auth-view.js?v=4.16"></script>
  <script src="/assets/js/views/dashboard-view.js?v=4.16"></script>
  <script src="/assets/js/views/cadastros-view.js?v=4.16"></script>
  <script src="/assets/js/views/catalogo-view.js?v=4.16"></script>
  <script src="/assets/js/views/compras-view.js?v=4.16"></script>
  <script src="/assets/js/views/orcamentos-view.js?v=4.16"></script>
  <script src="/assets/js/views/faturamento-view.js?v=4.16"></script>
  <script src="/assets/js/views/financeiro-view.js?v=4.16"></script>
  <script src="/assets/js/views/conciliacao-view.js?v=4.16"></script>
  <script src="/assets/js/views/administracao-view.js?v=4.16"></script>
  <script src="/assets/js/views/relatorios-view.js?v=4.16"></script>

  <!-- Roteador SPA e Inicializador Central -->
  <script src="/assets/js/router.js?v=4.16"></script>
  <script src="/assets/js/app.js?v=4.16"></script>
</body>
</html>
